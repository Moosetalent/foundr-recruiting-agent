# Slack app manifest for the Gold matching agent.
# Create the app in two clicks: https://api.slack.com/apps -> Create New App -> From a manifest
# -> pick the workspace -> paste this file -> Create. Then:
#   1. Basic Information -> App-Level Tokens -> Generate (scope connections:write)  => SLACK_APP_TOKEN (xapp-...)
#   2. Install App -> Install to Workspace                                         => SLACK_BOT_TOKEN (xoxb-...)
#   3. In Slack: /invite @Gold in #candidates
display_information:
  name: Gold
  description: Matches candidate threads to live Paraform roles. Tag "@Gold gold" in a candidate thread.
  background_color: "#1B1F2A"
features:
  bot_user:
    display_name: Gold
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - files:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
